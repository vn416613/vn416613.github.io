{{ define "main" }}
{{ $r := hugo.Data.resume }}
<article class="post-single portfolio-page">
  <header class="page-header">
    <h1>Experience</h1>
    <p>Education, learning direction, and project growth record.</p>
  </header>
  <div class="timeline">
    {{ range $r.education }}
      <section>
        <span>{{ .period }}</span>
        <h2>{{ .institution }}</h2>
        <h3>{{ .degree }}</h3>
        <p>{{ .major }}</p>
        <p>{{ .description }}</p>
      </section>
    {{ end }}
  </div>
</article>
{{ end }}
