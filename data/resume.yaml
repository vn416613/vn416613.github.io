projects:
  - name: "Pico 本地 AI Coding Agent"
    period: "2026.04 - 2026.06"
    role: "源码分析 / 二次开发准备 / 简历项目"
    tags:
      - "Python"
      - "LLM Agent"
      - "CLI"
      - "pytest"
      - "JSONL"
    intro: "基于 Python 构建的本地 AI 编程助手 Agent，支持在代码仓库中读取文件、搜索代码、执行命令、修改文件、保存会话状态，并通过受控工具调用协议连接 OpenAI-compatible、Anthropic-compatible、DeepSeek、Ollama 等模型后端。"
    bullets:
      - title: "Agent Runtime 主循环"
        text: "梳理 cli.py -> runtime.py -> context_manager.py -> tools.py -> models.py 的执行链路，理解 Pico.ask() 中用户请求记录、prompt 构建、模型调用、输出解析、工具执行与最终答案返回的完整流程。"
      - title: "受控工具调用"
        text: "分析 <tool>/<final> 协议、工具白名单、参数校验、重复调用拦截与审批策略，理解如何把模型意图安全落到文件读取、代码搜索、shell 执行、文件写入和 patch 修改等操作。"
      - title: "上下文管理与记忆"
        text: "掌握 prefix、memory、relevant_memory、history、current_request 分段构建 prompt 的方式，并理解历史压缩、文件摘要复用、工作记忆、长期记忆和 checkpoint 恢复机制。"
      - title: "运行审计与评测"
        text: "分析 task_state.json、trace.jsonl、report.json 的落盘逻辑，理解 benchmark 和 metrics 如何评估 Agent 在工具边界、安全恢复、上下文压缩和记忆机制上的稳定性。"
    metrics:
      - "支持 4 类模型后端"
      - "96 项测试通过（当前环境）"
      - "运行 trace / report 可复盘"

